<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Black & White Seating Plan</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: white;
        color: black;
        margin: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    @media print {
        @page {
            size: A4 landscape;
            margin: 10mm;
        }

        h1,
        #instructions,
        .controls,
        #warning,
        #pdfButtonContainer {
            display: none !important;
        }

        body {
            margin: 0;
            padding: 10px;
        }

        #classroomTop,
        #seatingPlan,
        #classroomBottom,
        h2 {
            break-inside: avoid;
            page-break-inside: avoid;
        }
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 20px;
        align-items: flex-start;
    }

    .control-box {
        display: flex;
        flex-direction: column;
    }

    label {
        margin-bottom: 5px;
        font-weight: bold;
    }

    select, textarea, button {
        border: 2px solid black;
        background: white;
        color: black;
        font-size: 16px;
        padding: 8px;
    }

    textarea {
        width: 750px;
        height: 180px;
        resize: vertical;
    }

    button {
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
        background: black;
        color: white;
    }

    button:hover {
        opacity: 0.85;
    }

    #pdfButtonContainer {
        margin-top: 25px;
        text-align: center;
    }

    #printArea {
        width: 277mm;
        min-height: 190mm;
        margin: 30px auto;
        padding: 8mm;
        border: 3px solid black;
        box-sizing: border-box;
        background: white;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    #planHeader {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        margin-bottom: 16px;
        flex-wrap: nowrap;
        width: 100%;
    }

    .header-group {
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
    }

    .header-title {
        font-size: 24px;
        font-weight: bold;
    }

    .header-input {
        width: 320px;
        border-bottom: 2px solid black;
        font-size: 20px;
        padding-bottom: 3px;
    }

    .date-input {
        width: 180px;
        border-bottom: 2px solid black;
        font-size: 20px;
        padding-bottom: 3px;
    }

    #classroomTop {
        border: 2px solid black;
        padding: 15px;
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
    }

    #classroomBottom {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        gap: 10px;
    }

    .classroom-label {
        border: 2px solid black;
        padding: 12px;
        text-align: center;
        font-weight: bold;
    }

    .small-label {
        flex: 1;
    }

    .large-label {
        flex: 3;
    }

    .editable-label {
        width: 100%;
        border: none;
        background: transparent;
        text-align: center;
        font-weight: bold;
        font-size: 16px;
        outline: none;
    }

    #instructions {
        border: 2px solid blue;
        color: blue;
        padding: 15px;
        margin-bottom: 20px;
        line-height: 1.8;
        font-weight: bold;
    }

    #warning {
        margin-top: 15px;
        padding: 12px;
        border: 2px solid black;
        display: none;
        font-weight: bold;
    }

    #seatingPlan {
        display: grid;
        gap: 10px;
        margin-top: 20px;
    }

    .seat {
        border: 2px solid black;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 10px;
        background: white;
        font-weight: bold;
        user-select: none;
        white-space: pre-line;
        line-height: 1.4;
    }

    .seat.dragging {
        opacity: 0.4;
    }

    .seat.empty {
        color: #999;
        font-style: italic;
    }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<h1>Seating Plan Planner</h1>

<div id="instructions">
    1. Import name list, separate each name by lines<br>
    2. Input row and column number<br>
    3. Drag and drop the seats<br>
    4. Export as PDF and print
</div>

<div class="controls">

    <div class="control-box">
        <label>Rows</label>
        <select id="rows">
            <option>4</option>
            <option selected>5</option>
            <option>6</option>
            <option>7</option>
        </select>
    </div>

    <div class="control-box">
        <label>Columns</label>
        <select id="cols">
            <option>4</option>
            <option>5</option>
            <option selected>6</option>
            <option>7</option>
        </select>
    </div>

    <div class="control-box">
        <label>Names (one per line)</label>
        <textarea id="names" placeholder="John
Mary
Alex"></textarea>
    </div>

    <div class="control-box">
        <label>&nbsp;</label>
        <button onclick="generatePlan()">Generate Seating Plan</button>
    </div>

</div>

<div id="printArea">
<div id="planHeader">
    <div class="header-group">
        <span class="header-title">Seating Plan of:</span>
        <input 
            class="editable-label header-input" 
            value="Class Name"
        />
    </div>

    <div class="header-group">
        <span class="header-title">Date:</span>
        <input 
            type="date"
            id="planDate"
            class="editable-label date-input"
        />
    </div>
</div>

<div id="classroomTop">
    <input class="editable-label" value="Locker" />
</div>

<div id="warning"></div>
<div id="seatingPlan"></div>

<div id="classroomBottom">
    <div class="classroom-label small-label">
        <input class="editable-label" value="Door" />
    </div>

    <div class="classroom-label large-label">
        <input class="editable-label" value="Board" />
    </div>

    <div class="classroom-label small-label">
        <input class="editable-label" value="Teacher" />
    </div>
</div>

</div>

<div id="pdfButtonContainer">
    <button onclick="generatePDF()">Generate PDF</button>
</div>

<script>
    let draggedSeat = null;

    function generatePlan() {

        const rows = parseInt(document.getElementById("rows").value);
        const cols = parseInt(document.getElementById("cols").value);

        const totalSeats = rows * cols;

        const namesText = document.getElementById("names").value.trim();

        let names = namesText
            ? namesText.split("\n").map(n => n.trim()).filter(n => n !== "")
            : [];

        // Too many names warning
        if (names.length > totalSeats) {
            const seatingPlan = document.getElementById("seatingPlan");
            const warning = document.getElementById("warning");

            seatingPlan.innerHTML = "";
            warning.style.display = "block";
            warning.textContent = `Too many names! Maximum seats available: ${totalSeats}`;
            return;
        }

        while (names.length < totalSeats) {
            names.push("");
        }

        // Arrange seats starting from bottom-right,
        // then upwards, then move left column by column
        const arrangedNames = Array(totalSeats).fill("");

        let index = 0;

        for (let col = cols - 1; col >= 0; col--) {
            for (let row = rows - 1; row >= 0; row--) {
                const position = row * cols + col;
                arrangedNames[position] = names[index] || "";
                index++;
            }
        }

        const seatingPlan = document.getElementById("seatingPlan");
        const warning = document.getElementById("warning");

        

        warning.style.display = "none";

        seatingPlan.innerHTML = "";
        seatingPlan.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        arrangedNames.forEach(name => {

            const seat = document.createElement("div");

            seat.className = "seat";
            seat.draggable = true;

            if (name === "") {
                seat.textContent = "Empty";
                seat.classList.add("empty");
            } else {

                // Split English + Chinese names into separate lines
                const formattedName = name.replace(/\s*([\u4e00-\u9fff].*)$/, "\n$1");

                seat.textContent = formattedName;
            }

            seat.addEventListener("dragstart", () => {
                draggedSeat = seat;
                seat.classList.add("dragging");
            });

            seat.addEventListener("dragend", () => {
                seat.classList.remove("dragging");
            });

            seat.addEventListener("dragover", (e) => {
                e.preventDefault();
            });

            seat.addEventListener("drop", () => {

                if (draggedSeat === seat) return;

                const tempText = seat.textContent;
                const tempEmpty = seat.classList.contains("empty");

                seat.textContent = draggedSeat.textContent;
                draggedSeat.textContent = tempText;

                if (draggedSeat.classList.contains("empty")) {
                    seat.classList.add("empty");
                } else {
                    seat.classList.remove("empty");
                }

                if (tempEmpty) {
                    draggedSeat.classList.add("empty");
                } else {
                    draggedSeat.classList.remove("empty");
                }

            });

            seatingPlan.appendChild(seat);

        });

    }

    function generatePDF() {
        const element = document.getElementById("printArea");

        // Save original styles
        const originalStyle = element.getAttribute('style') || '';

        // Force EXACT same layout as preview
        element.style.width = '277mm';
        element.style.minHeight = '190mm';
        element.style.padding = '8mm';
        element.style.margin = '0 auto';
        element.style.boxSizing = 'border-box';
        element.style.background = 'white';
        element.style.overflow = 'hidden';

        const opt = {
            margin: [0,0,0,0],
            filename: 'seating-plan.pdf',
            image: {
                type: 'jpeg',
                quality: 1
            },
            html2canvas: {
                scale: 2.5,
                useCORS: true,
                backgroundColor: '#ffffff'
            },
            jsPDF: {
                unit: 'mm',
                format: 'a4',
                orientation: 'landscape'
            }
        };

        html2pdf()
            .set(opt)
            .from(element)
            .save()
            .then(() => {
                element.setAttribute('style', originalStyle);
            });
    }

    // Default date = today
    document.getElementById('planDate').value = new Date().toISOString().split('T')[0];

    generatePlan();
</script>

</body>
</html>
